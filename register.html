
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUVEX | Register</title>

    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="register-container">

        <a href="auth.html" class="back">← กลับ</a>

        <header>
            <h1>EDU<span>VEX</span></h1>
            <p>ACADEMIC RPG PLATFORM</p>
            <h2>สร้างบัญชี EDUVEX</h2>
            <p class="description">เลือกประเภทบัญชีเพื่อเริ่มต้นการเรียนรู้</p>
        </header>

        <form id="registerForm">

            
<label>เลือกประเภทบัญชี</label>

<div class="role-select">

    <button type="button" class="role active" id="studentBtn">
        🎓 นักศึกษา
    </button>

    <button type="button" class="role" id="teacherBtn">
        📚 อาจารย์
    </button>

</div>

<input type="hidden" id="role" value="student">

<!-- แสดงข้อความเพียงจุดเดียว -->
<p id="roleMessage">
    คุณกำลังลงทะเบียนในฐานะนักศึกษา
</p>

<label id="userIdLabel" for="userId">
    รหัสนักศึกษา
</label>

<input type="text" id="userId"
    placeholder="กรอกรหัสนักศึกษา" required>


            <label for="fullName">ชื่อ - นามสกุล</label>
            <input type="text" id="fullName"
                placeholder="กรอกชื่อและนามสกุล" required>

            <label for="email">อีเมล</label>
            <input type="email" id="email"
                placeholder="example@email.com" required>

            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password"
                placeholder="อย่างน้อย 8 ตัวอักษร" required>

            <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirmPassword"
                placeholder="กรอกรหัสผ่านอีกครั้ง" required>

            <label class="terms">
                <input type="checkbox" id="acceptTerms" required>
                ยอมรับเงื่อนไขการใช้งาน
            </label>

            <p id="message"></p>

            <button type="submit" class="submit-btn">
                CREATE ACCOUNT →
            </button>

        </form>

        <p class="login-link">
            มีบัญชีแล้ว?
            <a href="login.html">เข้าสู่ระบบ</a>
        </p>

    </div>

    <script src="js/register.js"></script>
</body>
</html>
