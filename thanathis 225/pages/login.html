<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise System | Login</title>
    
    <!-- ดึง Tailwind CSS สำหรับวาง Layout หลักอย่างรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- เชื่อมต่อไฟล์ CSS ของเราเอง -->
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Decorator -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 relative z-10 mx-4 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">เข้าสู่ระบบ</h1>
            <p class="text-slate-500 mt-2 text-sm">ลงชื่อเข้าใช้เพื่อเข้าสู่ระบบจัดการสำหรับองค์กร</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">อีเมล (Email)</label>
                <input type="email" id="email" required placeholder="admin@enterprise.com" 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors">
                        <!-- Eye Icon -->
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-end mt-2">
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">ลืมรหัสผ่าน?</a>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 flex justify-center items-center gap-2 focus:ring-4 focus:ring-blue-300">
                <span>ลงชื่อเข้าใช้</span>
                <!-- Loading Spinner (Hidden by default) -->
                <svg id="loadingIcon" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 flex flex-col gap-3 z-50 pointer-events-none"></div>

    <!-- เชื่อมต่อไฟล์ JavaScript เป็นแบบ Module เพื่อรองรับ Firebase -->
    <script type="module" src="../src/js/app.js"></script>
</body>
</html>
